# PoC: run the Porch controllers (Repository + PackageRevision) as a sharded
# StatefulSet, partitioned by repository. Replaces the porch-controllers
# Deployment from deployments/porch/9-controllers.yaml. Keeps the same
# ServiceAccount, Service and k8s-app label so existing webhook wiring is
# unchanged.
#
# Shard count = spec.replicas, discovered at runtime by the membership watcher.
# shard-id is derived per-pod from the StatefulSet ordinal (POD_NAME).
# Scale with `kubectl scale statefulset porch-controllers --replicas=N` only.
---
# RBAC: the membership watcher reads this StatefulSet's spec.replicas to
# discover the live shard count. Least-privilege: one namespace, statefulsets
# read-only. (The generated ClusterRole also grants this via the kubebuilder
# marker once `make generate` is run; this Role makes the PoC self-contained.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: porch-controllers-shard-membership
  namespace: porch-system
rules:
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: porch-controllers-shard-membership
  namespace: porch-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: porch-controllers-shard-membership
subjects:
- kind: ServiceAccount
  name: porch-controllers
  namespace: porch-system
---
# Headless service required by the StatefulSet for stable pod network identity.
apiVersion: v1
kind: Service
metadata:
  name: porch-controllers-headless
  namespace: porch-system
  labels:
    k8s-app: porch-controllers
spec:
  clusterIP: None
  selector:
    k8s-app: porch-controllers
  ports:
    - port: 8081
      name: health
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: porch-controllers
  namespace: porch-system
  labels:
    k8s-app: porch-controllers
spec:
  serviceName: porch-controllers-headless
  # Shard count = replicas. The membership watcher discovers this at runtime;
  # scale with `kubectl scale statefulset porch-controllers --replicas=N`.
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      k8s-app: porch-controllers
  template:
    metadata:
      labels:
        k8s-app: porch-controllers
    spec:
      serviceAccountName: porch-controllers
      securityContext:
        fsGroup: 10001
      volumes:
      - name: cache-volume
        emptyDir: {}
      - name: webhook-certs
        secret:
          secretName: porch-controllers-webhook-tls
          defaultMode: 0440
      containers:
      - name: porch-controllers
        image: porch-kind/porch-controllers:test
        imagePullPolicy: IfNotPresent
        args:
        - --repositories.cache-type=DB
        - --repositories.push-drafts-to-git=true
        - --repositories.create-v1alpha2-rpkg=true
        # Sharding needs no flags: shard-id is derived from the pod ordinal
        # (POD_NAME) and the shard count is discovered from spec.replicas below.
        # Scale by changing replicas alone.
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
        volumeMounts:
        - name: cache-volume
          mountPath: /cache
        - name: webhook-certs
          mountPath: /etc/webhook/certs
        env:
        # Downward-API pod name — the controller derives its shard ordinal from this.
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # The controller discovers its own namespace from the ServiceAccount
        # token (for the membership watcher's StatefulSet lookup); no env needed.
        # Sharded pods run only the repository-keyed reconcilers. PackageVariant
        # (Set) default off (not enabled here) — they are not repository-keyed
        # and belong in a separate singleton deployment if used.
        - name: ENABLE_REPOSITORIES
          value: "true"
        - name: ENABLE_PACKAGEREVISIONS
          value: "true"
        - name: GIT_CACHE_DIR
          value: "/cache"
        - name: FUNCTION_CACHE_DIR
          value: "/home/nonroot/functions"
        - name: POD_NAMESPACE
          value: "porch-fn-system"
        - name: POD_EVALUATOR_ADDRESS
          value: api.porch-system.svc.cluster.local:9447
        - name: OTEL_SERVICE_NAME
          value: porch-controllers
        - name: OTEL_METRICS_EXPORTER
          value: "prometheus"
        - name: OTEL_EXPORTER_PROMETHEUS_HOST
          value: "0.0.0.0"
        - name: OTEL_EXPORTER_PROMETHEUS_PORT
          value: "9464"
        - name: OTEL_TRACES_EXPORTER
          value: none
        envFrom:
        - configMapRef:
            name: porch-db-config
            optional: true
        - secretRef:
            name: porch-db-secret
            optional: true
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 1Gi
            cpu: 1000m
        startupProbe:
          httpGet:
            path: /healthz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
          timeoutSeconds: 5
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8081
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /readyz
            port: 8081
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        ports:
        - containerPort: 9464
          name: metrics
          protocol: TCP
        - containerPort: 8080
          name: pprof
          protocol: TCP
