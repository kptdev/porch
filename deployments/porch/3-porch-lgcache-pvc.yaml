# Shared local-git cache. ReadWriteOnce is one node, and porch-server and
# porch-controllers both run on the kind node, so they can mount the same
# claim. kind's local-path provisioner creates the directory mode 0777, which
# uid 10001 can write. A hostPath volume cannot: kubelet creates it as root
# mode 0755 and does not apply fsGroup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: porch-lgcache
  namespace: porch-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
