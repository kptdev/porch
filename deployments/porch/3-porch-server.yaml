kind: ServiceAccount
apiVersion: v1
metadata:
  name: porch-server
  namespace: porch-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: porch-server
  namespace: porch-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: porch-server
  template:
    metadata:
      labels:
        app: porch-server
    spec:
      serviceAccountName: porch-server
      volumes:
        - name: cache-volume
          emptyDir: {}
        - name: api-server-certs
          emptyDir: {}
        - name: porch-config
          configMap:
            name: porch-config
            items:
              - key: porch.yaml
                path: porch.yaml
      containers:
        - name: porch-server
          # Update image to the image of your porch apiserver build.
          image: ghcr.io/kptdev/porch-server:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
          volumeMounts:
            - mountPath: /cache
              name: cache-volume
            - name: api-server-certs
              mountPath: /tmp/certs
            - name: porch-config
              mountPath: /etc/porch
              readOnly: true
          envFrom:
            - secretRef:
                name: porch-db-secret
          env:
            - name: OTEL_SERVICE_NAME
              value: porch-server
            - name: GOOGLE_API_GO_EXPERIMENTAL_DISABLE_NEW_AUTH_LIB
              value: "true"
          args:
            - --config=/etc/porch/porch.yaml
          ports:
            - containerPort: 9464
              name: metrics
              protocol: TCP
            - containerPort: 8080
              name: pprof
              protocol: TCP
            - containerPort: 9447
              name: fn-eval
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: 4443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4443
              scheme: HTTPS
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 4443
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 6
            successThreshold: 1
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: porch-system
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 4443
      name: api
    - port: 9464
      protocol: TCP
      targetPort: 9464
      name: metrics
    - port: 9447
      protocol: TCP
      targetPort: 9447
      name: fn-eval
  selector:
    app: porch-server
