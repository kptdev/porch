kind: ServiceAccount
apiVersion: v1
metadata:
  name: porch-fn-runner
  namespace: porch-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: function-runner
  namespace: porch-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: function-runner
  template:
    metadata:
      labels:
        app: function-runner
    spec:
      serviceAccountName: porch-fn-runner
      volumes:
        - name: porch-config
          configMap:
            name: porch-config
            items:
              - key: porch.yaml
                path: porch.yaml
      containers:
        - name: function-runner
          image: ghcr.io/kptdev/porch-function-runner:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: porch-config
              mountPath: /etc/porch
              readOnly: true
          command:
            - /home/nonroot/server
            - --config=/etc/porch/porch.yaml
          env:
            - name: OTEL_SERVICE_NAME
              value: porch-function-runner
          ports:
            - containerPort: 9445
            - containerPort: 9464
              name: metrics
            - containerPort: 8080
              name: pprof
          # Add grpc readiness probe to ensure the cache is ready
          startupProbe:
            exec:
              command:
                - /home/nonroot/grpc-health-probe
                - -addr
                - localhost:9445
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /home/nonroot/grpc-health-probe
                - -addr
                - localhost:9445
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - /home/nonroot/grpc-health-probe
                - -addr
                - localhost:9445
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "125m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: function-runner
  namespace: porch-system
spec:
  selector:
    app: function-runner
  ports:
    - port: 9445
      protocol: TCP
      targetPort: 9445
      name: grpc
    - port: 9464
      protocol: TCP
      targetPort: 9464
      name: metrics
