# Baseline porch.yaml for applying this folder without `make deployment-config`.
# Only fields required for porch-server/controllers to start against these
# manifests (wrapper image, HTTPS port/certs, DB-cache connectivity, repo
# reconciler). `make deployment-config` replaces this from deployments/config/porch-config.yaml.
# TODO: maybe add a sync make target?
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: porch-system
  name: porch-config
data:
  porch.yaml: |
    server:
      cacheType: DB
      cacheDirectory: /cache
      database:
        host: porch-postgresql
        port: "5432"
        name: porch
      podEvaluator:
        wrapperServerImage: ghcr.io/kptdev/porch-wrapper-server:latest
      serving:
        bindPort: 4443
        certDir: /tmp/certs
    controllers:
      enableRepositories: true
      repository:
        cacheDirectory: /cache
        database:
          host: porch-postgresql
          port: "5432"
          name: porch