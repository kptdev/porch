# The porch-config ConfigMap mounted by the Deployments. porch.yaml is empty
# here, so when this folder is applied on its own the components run on their
# built-in defaults. `make deployment-config` fills porch.yaml in from
# deployments/config/porch-config.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: porch-system
  name: porch-config
data:
  porch.yaml: ""
