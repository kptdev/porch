version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
  - package-ecosystem: gomod
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
  - package-ecosystem: gomod
    directory: /examples/apps/hello-server
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
