name: golangci-lint
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3.0.4
        id: filter
        with:
          filters: |
            code:
              - '**.Dockerfile'
              - '**/*.go'
              - '.golangci.json'
              - 'Makefile'
              - 'api/**'
              - 'build/**'
              - 'cmd/**'
              - 'controllers/**'
              - 'func/**'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'make/**.mk'
              - 'pkg/**'

  golangci:
    name: lint
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.code == 'true'
    steps:
      - name: Checkout Porch
        uses: actions/checkout@v7
      - name: Set up Go
        uses: kptdev/kpt/.github/actions/setup-go-kpt@main
        with:
          install-kpt: "false"
      - name: Run Linter
        run: make lint

  lint-summary:
    name: Lint Summary
    if: always()
    needs: [check-changes, golangci]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: |
          needs.check-changes.outputs.code == 'true' &&
          (needs.golangci.result == 'failure' || needs.golangci.result == 'cancelled')
      - run: echo "Lint passed or skipped"
