name: Version Drift Check
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      versions: ${{ steps.filter.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad  # v3.0.4
        id: filter
        with:
          filters: |
            versions:
              - 'docs/config.toml'
              - 'go.mod'
              - 'go.sum'
              - 'api/go.mod'
              - '.github/workflows/version-check.yaml'
              - '.github/workflows/porch-e2e-ci-jobs.yaml'
              - 'deployments/local/kind_porch_test_cluster.yaml'
              - 'scripts/util/check-versions.sh'
              - 'docs/content/en/docs/3_getting_started/compatibility.md'
              - 'docs/content/en/docs/3_getting_started/_index.md'
              - 'docs/content/en/docs/6_configuration_and_deployments/configurations/components/porch-webhooks/cert-manager-webhooks.md'

  check-versions:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.versions == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch full git history
        run: git fetch --unshallow --tags

      - name: Check version consistency
        run: bash scripts/util/check-versions.sh

  version-check-summary:
    name: Version Check Summary
    if: always()
    needs: [check-changes, check-versions]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: |
          (needs.check-changes.outputs.versions == 'true' || github.event_name == 'workflow_dispatch') &&
          (needs.check-versions.result == 'failure' || needs.check-versions.result == 'cancelled')
      - run: echo "Version check passed or skipped"

