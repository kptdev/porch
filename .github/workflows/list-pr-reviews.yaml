name: List PR Reviews

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

jobs:
  list-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: List all reviewers and their status
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number || context.payload.pull_request.number;

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            // Keep only the latest review per reviewer
            const latestByReviewer = new Map();
            for (const review of reviews) {
              if (review.state === 'PENDING') continue;
              latestByReviewer.set(review.user.login, review.state);
            }

            const approved = [];
            const notApproved = [];

            for (const [login, state] of latestByReviewer) {
              if (state === 'APPROVED') {
                approved.push(login);
              } else {
                notApproved.push(`${login} (${state.toLowerCase().replace('_', ' ')})`);
              }
            }

            core.summary.addHeading('PR Review Status', 2);

            if (approved.length) {
              core.summary.addHeading('✅ Approved', 3);
              core.summary.addList(approved);
            }

            if (notApproved.length) {
              core.summary.addHeading('⏳ Not Approved', 3);
              core.summary.addList(notApproved);
            }

            if (!approved.length && !notApproved.length) {
              core.summary.addRaw('No reviews submitted yet.');
            }

            await core.summary.write();

            core.info('--- PR Review Summary ---');
            core.info(`Approved: ${approved.join(', ') || 'none'}`);
            core.info(`Not approved: ${notApproved.join(', ') || 'none'}`);
