name: Release Image Build & Push

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-pre[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-pre.[0-9]+"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: kptdev

permissions:
  contents: read

jobs:
  check-replace-directives:
    if: github.repository_owner == 'kptdev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: kptdev/kpt/.github/actions/setup-go-kpt@main
        with:
          install-kpt: "false"

      - name: Check for replace directives in go.mod
        uses: kptdev/kpt/.github/actions/check-go-mod-replace@main
        with:
          allowed-replacements: '["k8s.io/apiserver"]'

      - name: Check for replace directives in api/go.mod
        uses: kptdev/kpt/.github/actions/check-go-mod-replace@main
        with:
          working-directory: api

  build-and-push-image:
    needs: check-replace-directives
    if: github.repository_owner == 'kptdev'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./build/Dockerfile
            image: ghcr.io/kptdev/porch-server
          - dockerfile: ./controllers/Dockerfile
            image: ghcr.io/kptdev/porch-controllers
          - dockerfile: ./func/Dockerfile
            image: ghcr.io/kptdev/porch-function-runner
          - dockerfile: ./func/Dockerfile-wrapperserver
            image: ghcr.io/kptdev/porch-wrapper-server
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Extract image versions from Makefile
        id: versions
        run: |
          echo "alpine=$(make --eval='print: ; @echo $(ALPINE_VERSION)' print)" >> "$GITHUB_OUTPUT"
          echo "golang_bookworm=$(make --eval='print: ; @echo $(GOLANG_BOOKWORM_VERSION)' print)" >> "$GITHUB_OUTPUT"
          echo "golang_alpine=$(make --eval='print: ; @echo $(GOLANG_ALPINE_VERSION)' print)" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            # 'stable' tracks the most recent non-prerelease release only.
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-pre') }}

      - name: Build and push Docker images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          sbom: true
          build-args: |
            ALPINE_VERSION=${{ steps.versions.outputs.alpine }}
            GOLANG_BOOKWORM_VERSION=${{ steps.versions.outputs.golang_bookworm }}
            GOLANG_ALPINE_VERSION=${{ steps.versions.outputs.golang_alpine }}
