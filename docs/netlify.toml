# Hugo build configuration for Netlify

[build]
  base = "docs"
  command = "../scripts/codegen/build-versioned-docs.sh"
  publish = "public"
  # Skip the build only when neither docs/ nor the build script changed on the branch.
  # Netlify runs this from the base directory (docs/), so the paths are anchored to the
  # repo root (:/). Exit 0 skips the build and exit 1 builds. If the merge base cannot be
  # found (for example a shallow checkout without origin/main), build rather than skip.
  ignore = 'base=$(git merge-base origin/main HEAD) || exit 1; git diff --quiet "$base" HEAD -- :/docs :/scripts/codegen/build-versioned-docs.sh'

[build.environment]
  GO_VERSION = "1.26.5"
  HUGO_VERSION = "0.161.1"
  HUGO_ENV = "production"
  NODE_VERSION = "24.15.0"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview.environment]
  HUGO_ENV = "development"

[context.branch-deploy.environment]
  HUGO_ENV = "development"
