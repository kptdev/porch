# Hugo build configuration for Netlify

[build]
  base = "docs"
  command = "../scripts/codegen/build-versioned-docs.sh"
  publish = "public"
  # Skip the build when nothing under docs/ or the build script changed. Exit 0 skips,
  # exit 1 builds. Always build production so main is never stale. Build (never skip)
  # when there is no usable cache ref: empty, unresolvable (shallow clone), or equal to
  # COMMIT_REF (Netlify sets CACHED_COMMIT_REF == COMMIT_REF on a cacheless build, which
  # would otherwise self-diff to empty and wrongly skip). Paths use :/ because Netlify
  # runs this from the base dir (docs/).
  ignore = '''
    echo "ignore: CONTEXT=$CONTEXT CACHED_COMMIT_REF=$CACHED_COMMIT_REF COMMIT_REF=$COMMIT_REF" >&2
    if [ "$CONTEXT" = "production" ]; then echo "ignore: production -> build" >&2; exit 1; fi
    if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then echo "ignore: no usable cache ref -> build" >&2; exit 1; fi
    git cat-file -e "$CACHED_COMMIT_REF^{commit}" 2>/dev/null || { echo "ignore: cache ref not in checkout -> build" >&2; exit 1; }
    if git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- :/docs :/scripts/codegen/build-versioned-docs.sh; then
      echo "ignore: no docs/build-script changes -> skip" >&2; exit 0
    fi
    echo "ignore: docs/build-script changed -> build" >&2; exit 1
  '''

[build.environment]
  GO_VERSION = "1.26.8"
  HUGO_VERSION = "0.161.1"
  HUGO_ENV = "production"
  NODE_VERSION = "24.15.0"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview.environment]
  HUGO_ENV = "development"

[context.branch-deploy.environment]
  HUGO_ENV = "development"
