# Hugo build configuration for Netlify

[build]
  base = "docs"
  command = "../scripts/codegen/build-versioned-docs.sh"
  publish = "public"
  ignore = "git diff --quiet $(git merge-base origin/main HEAD) HEAD -- docs/ scripts/codegen/build-versioned-docs.sh"

[build.environment]
  GO_VERSION = "1.26.5"
  HUGO_VERSION = "0.161.1"
  HUGO_ENV = "production"
  NODE_VERSION = "24.15.0"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview.environment]
  HUGO_ENV = "development"

[context.branch-deploy.environment]
  HUGO_ENV = "development"
