usesPorchTestRepo: true
commands:
  - args:
      - porchctl
      - repo
      - register
      - --namespace=rpkg-pull-overwrite
      - --name=git
      - --repo-basic-password=secret
      - --repo-basic-username=porch
      - http://gitea.gitea.svc.cluster.local:3000/porch/porch-test
  - args:
      - porchctl
      - rpkg
      - init
      - --namespace=rpkg-pull-overwrite
      - --repository=git
      - --workspace=v1
      - test-package
    stdout: |
      git.test-package.v1 created
  - args:
      - porchctl
      - rpkg
      - pull
      - --namespace=rpkg-pull-overwrite
      - git.test-package.v1
      - /tmp/porch-e2e/rpkg-pull-overwrite-git.test-package
  - args:
      - porchctl
      - rpkg
      - pull
      - --namespace=rpkg-pull-overwrite
      - git.test-package.v1
      - /tmp/porch-e2e/rpkg-pull-overwrite-git.test-package
  - args:
      - porchctl
      - rpkg
      - init
      - --namespace=rpkg-pull-overwrite
      - --repository=git
      - --workspace=v1
      - test-package-2
    stdout: |
      git.test-package-2.v1 created
  - args:
      - porchctl
      - rpkg
      - pull
      - --namespace=rpkg-pull-overwrite
      - git.test-package-2.v1
      - /tmp/porch-e2e/rpkg-pull-overwrite-git.test-package
    exitCode: 1
    stderr: |
      Error: directory "/tmp/porch-e2e/rpkg-pull-overwrite-git.test-package" already exists, please delete the directory and retry; you may overwrite the directory with --force 
  - args:
      - porchctl
      - rpkg
      - pull
      - --namespace=rpkg-pull-overwrite
      - --force
      - git.test-package-2.v1
      - /tmp/porch-e2e/rpkg-pull-overwrite-git.test-package
