usesPorchTestRepo: true
commands:
  - args:
      - porchctl
      - repo
      - register
      - --namespace=rpkg-clone-upgrade-subpkg
      - --name=git
      - --v1alpha2
      - --repo-basic-password=secret
      - --repo-basic-username=porch
      - http://gitea.gitea.svc.cluster.local:3000/porch/porch-test
  - args:
      - porchctl
      - rpkg
      - init
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - --repository=git
      - --workspace=first-cut
      - upstream-package
    stdout: |
      git.upstream-package.first-cut created
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - propose
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.first-cut
    stdout: |
      git.upstream-package.first-cut proposed
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - approve
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.first-cut
    stdout: |
      git.upstream-package.first-cut approved
    waitForPublished: true
  - args:
      - porchctl
      - rpkg
      - copy
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - --workspace=second-cut
      - git.upstream-package.first-cut
    stdout: |
      git.upstream-package.second-cut created
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - propose
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.second-cut
    stdout: |
      git.upstream-package.second-cut proposed
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - approve
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.second-cut
    stdout: |
      git.upstream-package.second-cut approved
    waitForPublished: true
  - args:
      - porchctl
      - rpkg
      - init
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - --repository=git
      - --workspace=alpha
      - parent-with-subpackages
    stdout: |
      git.parent-with-subpackages.alpha created
    waitForReady: true
  # Clone a subpackage from a porch-managed upstream PR
  - args:
      - porchctl
      - rpkg
      - clone
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - --subpackage-dir=subpackages/upstream-function
      - git.upstream-package.first-cut
      - git.parent-with-subpackages.alpha
    stdout: |
      subpackage cloned into directory "subpackages/upstream-function" in package revision "git.parent-with-subpackages.alpha"
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - pull
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.alpha
      - /tmp/porch-e2e/rpkg-clone-upgrade-subpkg
  - args:
      - sh
      - -c
      - ls "/tmp/porch-e2e/rpkg-clone-upgrade-subpkg/subpackages/upstream-function/Kptfile" >> /dev/null 2>&1 && echo "found subpackages/upstream-function/Kptfile"
    stdout: |
      found subpackages/upstream-function/Kptfile
  - args:
      - sh
      - -c
      - |
        grep -q "ref: upstream-package/v1" /tmp/porch-e2e/rpkg-clone-upgrade-subpkg/subpackages/upstream-function/Kptfile && echo "found reference upstream-package/v1 in subpackages/upstream-function/Kptfile"
    stdout: |
      found reference upstream-package/v1 in subpackages/upstream-function/Kptfile
  - args:
      - sh
      - -c
      - |
        rm -fr /tmp/porch-e2e/rpkg-clone-upgrade-subpkg
  # Clone a subpackage from a remote git URL
  - args:
      - porchctl
      - rpkg
      - clone
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - --directory=package-examples/wordpress
      - --ref=v1.0.0-beta.64
      - --subpackage-dir=clone-remote/wordpress
      - https://github.com/kptdev/kpt
      - git.parent-with-subpackages.alpha
    stdout: |
      subpackage cloned into directory "clone-remote/wordpress" in package revision "git.parent-with-subpackages.alpha"
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - pull
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.alpha
      - /tmp/porch-e2e/rpkg-clone-upgrade-subpkg
  - args:
      - sh
      - -c
      - ls "/tmp/porch-e2e/rpkg-clone-upgrade-subpkg/clone-remote/wordpress/Kptfile" >> /dev/null 2>&1 && echo "found clone-remote/wordpress/Kptfile"
    stdout: |
      found clone-remote/wordpress/Kptfile
  - args:
      - sh
      - -c
      - |
        grep -q "ref: v1.0.0-beta.64" /tmp/porch-e2e/rpkg-clone-upgrade-subpkg/clone-remote/wordpress/Kptfile && echo "found reference v1.0.0-beta.64 in clone-remote/wordpress/Kptfile"
    stdout: |
      found reference v1.0.0-beta.64 in clone-remote/wordpress/Kptfile
  - args:
      - sh
      - -c
      - |
        rm -fr /tmp/porch-e2e/rpkg-clone-upgrade-subpkg
  - args:
      - porchctl
      - rpkg
      - propose
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.alpha
    stdout: |
      git.parent-with-subpackages.alpha proposed
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - approve
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.alpha
    stdout: |
      git.parent-with-subpackages.alpha approved
    waitForPublished: true
  - args:
      - porchctl
      - rpkg
      - copy
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - --workspace=beta
      - git.parent-with-subpackages.alpha
    stdout: |
      git.parent-with-subpackages.beta created
    waitForReady: true
  # Upgrade subpackage to latest (second-cut = v2)
  - args:
      - porchctl
      - rpkg
      - upgrade
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - --subpackage-dir=subpackages/upstream-function
      - --strategy=force-delete-replace
      - git.parent-with-subpackages.beta
    stdout: |
      independent subpackage in directory "subpackages/upstream-function" in package "git.parent-with-subpackages.beta" upgraded
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - pull
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.beta
      - /tmp/porch-e2e/rpkg-clone-upgrade-subpkg
  - args:
      - sh
      - -c
      - ls "/tmp/porch-e2e/rpkg-clone-upgrade-subpkg/subpackages/upstream-function/Kptfile" >> /dev/null 2>&1 && echo "found subpackages/upstream-function/Kptfile"
    stdout: |
      found subpackages/upstream-function/Kptfile
  - args:
      - sh
      - -c
      - |
        grep -q "ref: upstream-package/v2" /tmp/porch-e2e/rpkg-clone-upgrade-subpkg/subpackages/upstream-function/Kptfile && echo "found reference upstream-package/v2 in subpackages/upstream-function/Kptfile"
    stdout: |
      found reference upstream-package/v2 in subpackages/upstream-function/Kptfile
  - args:
      - sh
      - -c
      - |
        rm -fr /tmp/porch-e2e/rpkg-clone-upgrade-subpkg
  - args:
      - porchctl
      - rpkg
      - propose
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.beta
    stdout: |
      git.parent-with-subpackages.beta proposed
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - approve
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.beta
    stdout: |
      git.parent-with-subpackages.beta approved
    waitForPublished: true
  # Create upstream v3 and v4
  - args:
      - porchctl
      - rpkg
      - copy
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - --workspace=third-cut
      - git.upstream-package.second-cut
    stdout: |
      git.upstream-package.third-cut created
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - propose
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.third-cut
    stdout: |
      git.upstream-package.third-cut proposed
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - approve
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.third-cut
    stdout: |
      git.upstream-package.third-cut approved
    waitForPublished: true
  - args:
      - porchctl
      - rpkg
      - copy
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - --workspace=fourth-cut
      - git.upstream-package.third-cut
    stdout: |
      git.upstream-package.fourth-cut created
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - propose
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.fourth-cut
    stdout: |
      git.upstream-package.fourth-cut proposed
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - approve
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.fourth-cut
    stdout: |
      git.upstream-package.fourth-cut approved
    waitForPublished: true
  - args:
      - porchctl
      - rpkg
      - copy
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - --workspace=gamma
      - git.parent-with-subpackages.beta
    stdout: |
      git.parent-with-subpackages.gamma created
    waitForReady: true
  # Upgrade subpackage to a specific revision (--revision=3)
  - args:
      - porchctl
      - rpkg
      - upgrade
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - --subpackage-dir=subpackages/upstream-function
      - --strategy=force-delete-replace
      - --revision=3
      - git.parent-with-subpackages.gamma
    stdout: |
      independent subpackage in directory "subpackages/upstream-function" in package "git.parent-with-subpackages.gamma" upgraded
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - pull
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.gamma
      - /tmp/porch-e2e/rpkg-clone-upgrade-subpkg
  - args:
      - sh
      - -c
      - ls "/tmp/porch-e2e/rpkg-clone-upgrade-subpkg/subpackages/upstream-function/Kptfile" >> /dev/null 2>&1 && echo "found subpackages/upstream-function/Kptfile"
    stdout: |
      found subpackages/upstream-function/Kptfile
  - args:
      - sh
      - -c
      - |
        grep -q "ref: upstream-package/v3" /tmp/porch-e2e/rpkg-clone-upgrade-subpkg/subpackages/upstream-function/Kptfile && echo "found reference upstream-package/v3 in subpackages/upstream-function/Kptfile"
    stdout: |
      found reference upstream-package/v3 in subpackages/upstream-function/Kptfile
  - args:
      - sh
      - -c
      - |
        rm -fr /tmp/porch-e2e/rpkg-clone-upgrade-subpkg
  - args:
      - porchctl
      - rpkg
      - propose
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.gamma
    stdout: |
      git.parent-with-subpackages.gamma proposed
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - approve
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.gamma
    stdout: |
      git.parent-with-subpackages.gamma approved
    waitForPublished: true
  - args:
      - porchctl
      - rpkg
      - copy
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - --workspace=delta
      - git.parent-with-subpackages.gamma
    stdout: |
      git.parent-with-subpackages.delta created
    waitForReady: true
  # Upgrade subpackage to latest (fourth-cut = v4)
  - args:
      - porchctl
      - rpkg
      - upgrade
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - --subpackage-dir=subpackages/upstream-function
      - git.parent-with-subpackages.delta
    stdout: |
      independent subpackage in directory "subpackages/upstream-function" in package "git.parent-with-subpackages.delta" upgraded
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - pull
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.delta
      - /tmp/porch-e2e/rpkg-clone-upgrade-subpkg
  - args:
      - sh
      - -c
      - ls "/tmp/porch-e2e/rpkg-clone-upgrade-subpkg/subpackages/upstream-function/Kptfile" >> /dev/null 2>&1 && echo "found subpackages/upstream-function/Kptfile"
    stdout: |
      found subpackages/upstream-function/Kptfile
  - args:
      - sh
      - -c
      - |
        grep -q "ref: upstream-package/v4" /tmp/porch-e2e/rpkg-clone-upgrade-subpkg/subpackages/upstream-function/Kptfile && echo "found reference upstream-package/v4 in subpackages/upstream-function/Kptfile"
    stdout: |
      found reference upstream-package/v4 in subpackages/upstream-function/Kptfile
  - args:
      - sh
      - -c
      - |
        rm -fr /tmp/porch-e2e/rpkg-clone-upgrade-subpkg
  - args:
      - porchctl
      - rpkg
      - propose
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.delta
    stdout: |
      git.parent-with-subpackages.delta proposed
    waitForReady: true
  - args:
      - porchctl
      - rpkg
      - approve
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.delta
    stdout: |
      git.parent-with-subpackages.delta approved
    waitForPublished: true
  # Cleanup — published packages require propose-delete before delete
  # Delete in reverse dependency order: delta → gamma → beta → alpha
  - args:
      - porchctl
      - rpkg
      - propose-delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.delta
    stdout: |
      git.parent-with-subpackages.delta proposed for deletion
  - args:
      - porchctl
      - rpkg
      - delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.delta
    stdout: |
      git.parent-with-subpackages.delta deleted
    waitForDeleted: true
  - args:
      - porchctl
      - rpkg
      - propose-delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.gamma
    stdout: |
      git.parent-with-subpackages.gamma proposed for deletion
  - args:
      - porchctl
      - rpkg
      - delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.gamma
    stdout: |
      git.parent-with-subpackages.gamma deleted
    waitForDeleted: true
  - args:
      - porchctl
      - rpkg
      - propose-delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.beta
    stdout: |
      git.parent-with-subpackages.beta proposed for deletion
  - args:
      - porchctl
      - rpkg
      - delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.beta
    stdout: |
      git.parent-with-subpackages.beta deleted
    waitForDeleted: true
  - args:
      - porchctl
      - rpkg
      - propose-delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.alpha
    stdout: |
      git.parent-with-subpackages.alpha proposed for deletion
  - args:
      - porchctl
      - rpkg
      - delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.parent-with-subpackages.alpha
    stdout: |
      git.parent-with-subpackages.alpha deleted
  # Delete upstream packages in reverse dependency order: fourth-cut → third-cut → second-cut → first-cut
  - args:
      - porchctl
      - rpkg
      - propose-delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.fourth-cut
    stdout: |
      git.upstream-package.fourth-cut proposed for deletion
  - args:
      - porchctl
      - rpkg
      - delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.fourth-cut
    stdout: |
      git.upstream-package.fourth-cut deleted
    waitForDeleted: true
  - args:
      - porchctl
      - rpkg
      - propose-delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.third-cut
    stdout: |
      git.upstream-package.third-cut proposed for deletion
  - args:
      - porchctl
      - rpkg
      - delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.third-cut
    stdout: |
      git.upstream-package.third-cut deleted
    waitForDeleted: true
  - args:
      - porchctl
      - rpkg
      - propose-delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.second-cut
    stdout: |
      git.upstream-package.second-cut proposed for deletion
  - args:
      - porchctl
      - rpkg
      - delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.second-cut
    stdout: |
      git.upstream-package.second-cut deleted
    waitForDeleted: true
  - args:
      - porchctl
      - rpkg
      - propose-delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.first-cut
    stdout: |
      git.upstream-package.first-cut proposed for deletion
  - args:
      - porchctl
      - rpkg
      - delete
      - --api-version=v1alpha2
      - --namespace=rpkg-clone-upgrade-subpkg
      - git.upstream-package.first-cut
    stdout: |
      git.upstream-package.first-cut deleted
